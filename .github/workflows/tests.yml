name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 编译并运行纯 JVM 单测
        run: |
          javac --release 8 -encoding UTF-8 -d /tmp/t test/*.java src/com/huandou/app/HostRules.java src/com/huandou/app/GateRules.java
          java -Dfile.encoding=UTF-8 -cp /tmp/t com.huandou.app.HostRulesTest
          java -Dfile.encoding=UTF-8 -cp /tmp/t com.huandou.app.GateRulesTest
